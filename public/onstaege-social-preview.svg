<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Onstaege social preview</title>
  <desc id="description">Onstaege — making the physical world digitally accessible.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09080f"/>
      <stop offset="0.52" stop-color="#11102a"/>
      <stop offset="1" stop-color="#09080f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6f66df"/>
      <stop offset="1" stop-color="#b48aff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7b70ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#7b70ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
  </defs>

  <rect width="1200" height="630" rx="0" fill="url(#background)"/>
  <circle cx="1000" cy="100" r="270" fill="url(#glow)" filter="url(#blur)"/>
  <circle cx="115" cy="615" r="250" fill="url(#glow)" opacity="0.65" filter="url(#blur)"/>
  <path d="M0 538 C270 470 448 620 710 535 S1005 455 1200 510 V630 H0Z" fill="#ffffff" opacity="0.025"/>
  <path d="M0 559 C275 500 465 627 718 555 S1010 485 1200 530" fill="none" stroke="#9187ff" stroke-opacity="0.16" stroke-width="2"/>

  <g transform="translate(78 72)">
    <rect width="82" height="82" rx="20" fill="#000" stroke="#ffffff" stroke-opacity="0.13"/>
    <path d="M11 12h17v3H11zm0 3q4 19-7 30 14-10 21-30zm60-3H54v3h17zm0 3q-4 19 7 30-14-10-21-30z" fill="#e50914"/>
    <path d="M29 14q4-2 8 0l4 54-24 2z" fill="#eee" opacity="0.95"/>
    <path d="M45 14q4-2 8 0l12 56-24-2z" fill="#fff" opacity="0.95"/>
    <ellipse cx="41" cy="70" rx="25" ry="4" fill="#fff"/>
  </g>
  <text x="182" y="128" fill="#fff" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" letter-spacing="-1.5">Onstaege</text>

  <g transform="translate(78 236)">
